name: catalogue-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/catalogue-probe.yml', 'scripts/catalogue/probe.mjs']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir -p data/probe
          node scripts/catalogue/probe.mjs kotn.com frankandoak.com tentree.ca www.mooseknucklescanada.com www.saxxunderwear.com knix.ca www.stance.com bombas.com www.allbirds.ca www.nativeshoes.ca herschel.ca us.rains.com www.quayaustralia.com davekny.com us.sunspel.com us.organicbasics.com reigningchamp.com fahertybrand.com www.outerknown.com vuoriclothing.com tommyjohn.com shopduer.com lespecs.com www.roots.com www.aritzia.com www.hanes.com www.gymshark.com www.mackweldon.com www.meundies.com www.taylorstitch.com www.everlane.com www.cuyana.com www.bellroy.com www.peakdesign.com www.blundstone.ca www.vessi.com www.naadam.co www.adayofficial.com www.girlfriend.com www.wearpact.com www.huckberry.com www.marine-layer.com www.richer-poorer.com www.ministryofsupply.com www.westernrise.com www.lululemon.com www.thereformation.com www.newbalance.com www.columbia.com www.patagonia.com www.thenorthface.com www.canadagoose.com www.guess.com www.calvinklein.us www.tommy.com www.ralphlauren.com www.bananarepublic.ca www.massimodutti.com shop.mango.com www.burberry.com www.victoriassecret.com www.nike.com www.adidas.ca > data/probe/shopify.tsv
      - run: |
          git config user.name "parche-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/probe && git commit -m "Probe results [skip ci]" && git push || true
