name: catalogue-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/catalogue-probe.yml', 'scripts/catalogue/probe.mjs']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir -p data/probe
          node scripts/catalogue/probe.mjs www.mackage.com www.rudsak.com www.soia-kyo.com www.toddsnyder.com www.buckmason.com krewe.com bluntumbrellas.com staud.clothing www.rouje.com faithfullthebrand.com realisationpar.com frame-store.com www.rag-bone.com agolde.com www.motherdenim.com www.commonprojects.com www.koio.co rothys.com www.larroude.com www.margauxny.com www.wingsandhorns.com www.cdlp.com www.thousandfell.com www.cariuma.com www.sunski.com goodr.com www.knockaround.com www.parkerclay.com www.dagnedover.com www.baggu.com www.lackofcolor.com www.brixton.com www.tenthousand.cc www.rhone.com www.aloyoga.com www.setactive.com www.outdoorvoices.com www.beyondyoga.com www.nobis.com www.quartzco.com www.solidandstriped.com www.frankiesbikinis.com www.onia.com www.summersalt.com www.andieswim.com www.lunya.co www.eberjey.com www.thirdlove.com www.cuup.com www.skims.com www.mejuri.com www.pajar.com www.kamik.com www.sorel.com www.ilovecozy.com www.byfar.com www.lisasaysgah.com www.doen.com www.citizensofhumanity.com www.lemaire.fr www.ganni.com www.arket.com www.cos.com www.nudiejeans.com www.mavi.com www.dynamiteclothing.com www.garageclothing.com www.kitandace.com www.oakandfort.com www.simons.ca www.bluenotes.com www.lechateau.com > data/probe/shopify2.tsv
      - run: |
          git config user.name "parche-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/probe && git commit -m "Probe results [skip ci]" && git push || true
