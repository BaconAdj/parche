name: catalogue-refresh
# Weekly: pull in-stock products from brand feeds, rebuild data/catalogue.json and commit it.
# Vercel redeploys on the commit, so prices, photos and availability stay current.
on:
  schedule:
    - cron: '17 9 * * 1'   # Mondays 09:17 UTC (5:17 am Montréal)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/catalogue/**', 'data/kinds.json', 'data/raw/seed/**']
permissions:
  contents: write
concurrency: { group: catalogue, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Pull brand feeds
        run: node scripts/catalogue/ingest-shopify.mjs
      - name: Pull Magento stores (Shan)
        run: node scripts/catalogue/ingest-magento.mjs
      - name: Build catalogue
        run: node scripts/catalogue/build.mjs
      - name: Commit
        run: |
          git config user.name "parche-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/seed data/raw/shopify-report.tsv data/catalogue.json data/catalogue-report.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh catalogue $(date -u +%F)"
          git pull --rebase origin main && git push
